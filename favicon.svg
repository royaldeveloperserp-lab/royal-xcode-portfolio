  <title id="title">Royal Expo Technologies emblem</title>
  <desc id="desc">A gold crown above a blue RX monogram, enclosed in a circular black and gold emblem.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0bd"/><stop offset=".48" stop-color="#d8b46a"/><stop offset="1" stop-color="#9e742e"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9ec8ff"/><stop offset="1" stop-color="#3478dc"/></linearGradient>
  </defs>
  <circle cx="64" cy="64" r="60" fill="#070b14" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="64" cy="64" r="52" fill="none" stroke="#d8b46a" stroke-opacity=".32" stroke-width="1.5"/>
  <path d="M35 35 27 19 47 29 64 12 81 29 101 19 93 35 88 45H40Z" fill="url(#gold)" stroke="#f4d99a" stroke-width="1.5" stroke-linejoin="round"/>
